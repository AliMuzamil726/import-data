services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sawie}
      POSTGRES_USER: ${DB_USER:-sawie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sawie}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sawie}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/app/media
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  media:
  static:
