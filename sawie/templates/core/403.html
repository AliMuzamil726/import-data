{% load static %}<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>403 · SAWIE</title>
  <link rel="icon" href="{% static 'images/logo.svg' %}" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{% static 'js/tailwind.config.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/sawie.css' %}">
</head>
<body class="grid h-full place-items-center bg-canvas font-sans px-4">

    <img src="{% static 'images/logo.svg' %}" alt="SAWIE" class="mx-auto h-12 w-12">
    <p class="mt-6 text-5xl font-semibold tracking-tight text-brand-600">403</p>

</html>
