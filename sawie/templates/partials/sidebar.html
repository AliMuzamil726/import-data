{% load static %}
<!-- Mobile backdrop -->
<div x-show="sidebarOpen" x-transition.opacity @click="sidebarOpen = false"
     class="fixed inset-0 z-30 bg-slate-900/50 lg:hidden" x-cloak></div>

<aside class="fixed inset-y-0 left-0 z-40 flex shrink-0 -translate-x-full flex-col bg-forest text-white transition-all duration-200 lg:translate-x-0"
       :class="[sidebarOpen && 'translate-x-0', collapsed ? 'w-[76px]' : 'w-[248px]']">

  <!-- Brand + desktop collapse toggle -->
  <div class="flex h-16 items-center gap-3 border-b border-white/10 px-4">
    <img src="{% static 'images/logo.svg' %}" alt="SAWIE" class="h-8 w-8 shrink-0">
    <div class="leading-tight sidebar-label" x-show="!collapsed" x-transition.opacity>
      <p class="text-sm font-semibold tracking-wide">SAWIE</p>
      <p class="text-[11px] text-white/50">Agricultural Intelligence</p>
    </div>
    <!-- Collapse toggle: only on desktop -->
    <button type="button" @click="toggleCollapse()"
            class="ml-auto hidden rounded-lg p-1.5 text-white/50 transition hover:bg-white/10 hover:text-white lg:block"
            :aria-label="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg class="h-4 w-4 transition-transform" :class="collapsed && 'rotate-180'"
           fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/>
      </svg>
    </button>
  </div>

  <nav class="flex flex-1 flex-col gap-0.5 overflow-y-auto px-3 py-4" aria-label="Main">
    {% for item in nav_items %}
      <a href="{% url item.url %}"
         :title="collapsed ? '{{ item.label }}' : ''"
         class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium transition
                {% if active_module == item.module %}bg-white/12 text-white shadow-inner-glow{% else %}text-white/65 hover:bg-white/8 hover:text-white{% endif %}"
         :class="collapsed && 'justify-center px-0'">
        <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg
                     {% if active_module == item.module %}bg-accent-400/20 text-accent-300{% else %}bg-white/5 text-white/60 group-hover:text-white{% endif %}"
              data-icon="{{ item.icon }}"></span>
        <span class="sidebar-label" x-show="!collapsed" x-transition.opacity>{{ item.label }}</span>
      </a>
    {% endfor %}
  </nav>

  <div class="border-t border-white/10 p-3">
    <a href="{% url 'accounts:profile' %}"
       :title="collapsed ? '{{ request.user.display_name }}' : ''"
       class="flex items-center gap-3 rounded-xl px-2 py-2 transition hover:bg-white/8"
       :class="collapsed && 'justify-center px-0'">
      {% if request.user.avatar %}
        <img src="{{ request.user.avatar.url }}" alt="" class="h-9 w-9 shrink-0 rounded-full object-cover">
      {% else %}
        <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-accent-400/20 text-xs font-semibold text-accent-200">{{ request.user.initials }}</span>
      {% endif %}
      <span class="min-w-0 sidebar-label" x-show="!collapsed" x-transition.opacity>
        <span class="block truncate text-sm font-medium text-white">{{ request.user.display_name }}</span>
        <span class="block truncate text-[11px] text-white/50">{{ request.user.get_role_display }}</span>
      </span>
    </a>
  </div>
</aside>
