{% load static %}<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password · SAWIE</title>
  <link rel="icon" href="{% static 'images/logo.svg' %}" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{% static 'js/tailwind.config.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/sawie.css' %}">
</head>
<body class="auth-canvas relative h-full font-sans text-white">
  <div class="auth-contours" aria-hidden="true"></div>
  <div class="relative flex min-h-full items-center justify-center px-4 py-10">
    <div class="w-full max-w-[420px] fade-up">
      <div class="mb-7 flex flex-col items-center text-center">
        <img src="{% static 'images/logo.svg' %}" alt="SAWIE" class="h-12 w-12">
        <h1 class="mt-4 text-xl font-semibold tracking-tight">Reset your password</h1>
        <p class="mt-1 text-sm text-white/55">We will email you a link to set a new one.</p>
      </div>
      <div class="auth-card rounded-2xl p-7 shadow-2xl">
        <form method="post" novalidate>
          {% csrf_token %}
          <label for="{{ form.email.id_for_label }}" class="mb-1.5 block text-xs font-medium text-white/70">Email address</label>
          <input type="email" name="email" id="{{ form.email.id_for_label }}" required autocomplete="email"
                 placeholder="you@sawie.io" class="w-full rounded-xl border border-white/15 bg-white/10 px-4 py-3 text-sm text-white placeholder-white/40 focus:border-accent-400 focus:outline-none focus:ring-2 focus:ring-accent-400/30">
          {% for error in form.email.errors %}<p class="mt-1 text-xs text-rose-300">{{ error }}</p>{% endfor %}
          <button type="submit" class="mt-5 w-full rounded-xl bg-brand-400 px-4 py-3 text-sm font-semibold text-forest transition hover:bg-accent-400">Send reset link</button>
        </form>
      </div>
      <p class="mt-6 text-center text-sm">
        <a href="{% url 'accounts:login' %}" class="text-white/60 transition hover:text-accent-300">Back to sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
