{% load static %}<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password updated · SAWIE</title>
  <link rel="icon" href="{% static 'images/logo.svg' %}" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{% static 'js/tailwind.config.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/sawie.css' %}">
</head>
<body class="auth-canvas relative h-full font-sans text-white">
  <div class="auth-contours" aria-hidden="true"></div>
  <div class="relative flex min-h-full items-center justify-center px-4 py-10">
    <div class="w-full max-w-[420px] fade-up">
      <div class="mb-7 flex flex-col items-center text-center">
        <img src="{% static 'images/logo.svg' %}" alt="SAWIE" class="h-12 w-12">
        <h1 class="mt-4 text-xl font-semibold tracking-tight">Password updated</h1>
        <p class="mt-1 text-sm text-white/55">You can sign in with your new password now.</p>
      </div>
      <div class="auth-card rounded-2xl p-7 shadow-2xl">
        <a href="{% url 'accounts:login' %}"
           class="block w-full rounded-xl bg-brand-400 px-4 py-3 text-center text-sm font-semibold text-forest transition hover:bg-accent-400">
          Go to sign in
        </a>
      </div>
      <p class="mt-6 text-center text-sm">
        <a href="{% url 'accounts:login' %}" class="text-white/60 transition hover:text-accent-300">Back to sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
